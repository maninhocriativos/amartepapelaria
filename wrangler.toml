# Cloudflare Workers configuration
name = "amarte-bio-links"
main = "src/index.js"
compatibility_date = "2024-12-16"

# Site configuration for static assets
[env.production]
name = "amarte-bio-links-prod"

# KV Namespace bindings (optional, for analytics)
[[kv_namespaces]]
binding = "ANALYTICS"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

# Build configuration
[build]
command = "echo 'No build needed'"
cwd = "./"

# Triggers for deployment
[triggers]
crons = []
